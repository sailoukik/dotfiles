# Hyprlock Configuration - Thor God of Thunder Edition

# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/wallpapers/thor_wallpaper.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 0.89
    brightness = 0.72
    vibrancy = 0.28
    vibrancy_darkness = 0.1
}

# GENERAL
general {
    no_fade_in = false
    grace = 1
    disable_loading_bar = false
}

# TIME (Asgard Gold)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(255, 215, 0) # Asgard Gold
    font_size = 96
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.8)
}

# DATE & RUNES (Lightning Cyan)
label {
    monitor =
    text = cmd[update:1000] echo "⚡ $(date +"%A, %d %B")  ᚦ"
    color = rgb(0, 229, 255) # Electric Cyan
    font_size = 22
    font_family = JetBrains Mono Nerd Font SemiBold
    position = 0, 90
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# USER AVATAR / ICON
label {
    monitor =
    text = ᚦ
    color = rgb(255, 215, 0)
    font_size = 36
    font_family = JetBrains Mono Nerd Font
    position = 0, 10
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 300, 52
    outline_thickness = 3
    dots_size = 0.26 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.25 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgba(255, 215, 0, 0.9) rgba(0, 229, 255, 0.9) 45deg
    inner_color = rgba(11, 14, 20, 0.85)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##00E5FF">ᛋ Speak, Worthy One...</span>
    hide_input = false
    rounding = 14
    check_color = rgb(0, 229, 255)
    fail_color = rgb(255, 85, 85)
    fail_text = <i><span foreground="##FF5555">⚡ Not Worthy to Wield Mjölnir ($ATTEMPTS)</span></i>
    fail_transition = 300
    capslock_color = rgb(255, 215, 0)
    position = 0, -60
    halign = center
    valign = center
}

# FOOTER MOTTO
label {
    monitor =
    text = ᚦ Whosoever holds this hammer, if he be worthy, shall possess the power of Thor ᛋ
    color = rgba(162, 178, 200, 0.7)
    font_size = 11
    font_family = JetBrains Mono Nerd Font
    position = 0, 30
    halign = center
    valign = bottom
}
