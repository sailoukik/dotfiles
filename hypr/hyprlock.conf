# ==============================================================================
# ⚡ HYPRLOCK CONFIGURATION - THOR GOD OF THUNDER EDITION
# Clean, High-Performance Asgardian Lockscreen with Live Widgets & Controls
# ==============================================================================

# ── BACKGROUND ────────────────────────────────────────────────────────────────
background {
    monitor =
    path = /home/loukik/.config/hypr/wallpapers/thor_wallpaper.jpg
    color = rgb(15, 22, 34)
    blur_passes = 1
    blur_size = 3
    noise = 0.012
    contrast = 0.95
    brightness = 0.82
    vibrancy = 0.22
    vibrancy_darkness = 0.05
}

# ── GENERAL ───────────────────────────────────────────────────────────────────
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
    hide_cursor = false
}

# ── TOP STATUS BAR ────────────────────────────────────────────────────────────

# Top-Left: Battery & Network Status
label {
    monitor =
    text = cmd[update:5000] echo "$(/home/loukik/.config/hypr/scripts/battery_lock.sh)   •   $(/home/loukik/.config/hypr/scripts/network_lock.sh)"
    color = rgb(0, 240, 255) # Electric Cyan
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 35, -35
    halign = left
    valign = top
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.8)
}

# Top-Right: Vigil Uptime Status
label {
    monitor =
    text = cmd[update:60000] /home/loukik/.config/hypr/scripts/uptime_lock.sh
    color = rgb(255, 215, 0) # Asgard Gold
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -35, -35
    halign = right
    valign = top
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.8)
}

# ── CENTER HERO: TIME & DATE ──────────────────────────────────────────────────

# Large Asgard Gold Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(255, 215, 0) # Asgard Gold
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 240, 255, 0.45)
}

# Date & Runic Inscription
label {
    monitor =
    text = cmd[update:1000] echo "⚡ $(date +"%A, %d %B")  ᚦ ᛋ"
    color = rgb(0, 240, 255) # Electric Cyan
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 105
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.8)
}

# ── NOW PLAYING / MEDIA STATUS ────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:2000] /home/loukik/.config/hypr/scripts/player_lock.sh
    color = rgb(226, 232, 240)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.8)
}

# ── USER IDENTITY ─────────────────────────────────────────────────────────────

# User Badge with Runes
label {
    monitor =
    text = ᚦ  $USER  ᛋ
    color = rgb(255, 215, 0) # Asgard Gold
    font_size = 20
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -15
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.8)
}

# Realm Subtitle
label {
    monitor =
    text = Sovereign of the Nine Realms
    color = rgba(162, 178, 200, 0.8)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -42
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# ── PASSWORD INPUT FIELD ──────────────────────────────────────────────────────
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 215, 0, 0.9) rgba(0, 240, 255, 0.9) 45deg
    inner_color = rgba(15, 22, 34, 0.88)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##00F0FF">ᛋ Speak, Worthy One...</span>
    hide_input = false
    rounding = 14
    check_color = rgb(0, 240, 255)
    fail_color = rgb(255, 85, 85)
    fail_text = <i><span foreground="##FF5555">⚡ Not Worthy to Wield Mjölnir ($ATTEMPTS)</span></i>
    fail_transition = 300
    capslock_color = rgb(255, 215, 0)
    position = 0, -100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.8)
}

# ── QUICK POWER ACTIONS (BOTTOM) ──────────────────────────────────────────────

# Suspend
label {
    monitor =
    text = 󰤄  Suspend
    color = rgb(0, 240, 255) # Electric Cyan
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    onclick = systemctl suspend
    position = -140, 65
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.8)
}

# Reboot
label {
    monitor =
    text = 󰜉  Reboot
    color = rgb(255, 215, 0) # Asgard Gold
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    onclick = systemctl reboot
    position = 0, 65
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.8)
}

# Poweroff
label {
    monitor =
    text = 󰐥  Power
    color = rgb(255, 85, 85) # Ragnarok Red
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    onclick = systemctl poweroff
    position = 140, 65
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.8)
}

# ── FOOTER MOTTO ──────────────────────────────────────────────────────────────
label {
    monitor =
    text = ᚦ Whosoever holds this hammer, if he be worthy, shall possess the power of Thor ᛋ
    color = rgba(162, 178, 200, 0.7)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 22
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
}
