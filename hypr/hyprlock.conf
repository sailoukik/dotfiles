# ==============================================================================
# ⚡ HYPRLOCK CONFIGURATION - THOR GOD OF THUNDER EDITION
# Premium Asgardian Lockscreen with Live Widgets, Media Player & Power Controls
# ==============================================================================

# ── BACKGROUND ────────────────────────────────────────────────────────────────
background {
    monitor =
    path = ~/.config/hypr/wallpapers/thor_wallpaper.jpg
    color = rgb(15, 22, 34)
    blur_passes = 1
    blur_size = 4
    noise = 0.015
    contrast = 0.95
    brightness = 0.82
    vibrancy = 0.25
    vibrancy_darkness = 0.1
}

# ── GENERAL ───────────────────────────────────────────────────────────────────
general {
    no_fade_in = false
    grace = 1
    disable_loading_bar = false
    hide_cursor = true
}

# ── TOP STATUS PILLS ─────────────────────────────────────────────────────────

# Top-Left Glass Backdrop (Battery & Network)
shape {
    monitor =
    size = 370, 42
    color = rgba(15, 22, 34, 0.78)
    rounding = 21
    border_size = 1
    border_color = rgba(0, 240, 255, 0.45)
    position = 32, -28
    halign = left
    valign = top
}

# Top-Left Label (Battery & Network)
label {
    monitor =
    text = cmd[update:5000] echo "$(~/.config/hypr/scripts/battery_lock.sh)   •   $(~/.config/hypr/scripts/network_lock.sh)"
    color = rgb(0, 240, 255) # Electric Cyan
    font_size = 11
    font_family = JetBrainsMono Nerd Font SemiBold
    position = 50, -39
    halign = left
    valign = top
    shadow_passes = 1
    shadow_size = 2
}

# Top-Right Glass Backdrop (Vigil Uptime)
shape {
    monitor =
    size = 270, 42
    color = rgba(15, 22, 34, 0.78)
    rounding = 21
    border_size = 1
    border_color = rgba(255, 215, 0, 0.45)
    position = -32, -28
    halign = right
    valign = top
}

# Top-Right Label (Vigil Uptime)
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/uptime_lock.sh
    color = rgb(255, 215, 0) # Asgard Gold
    font_size = 11
    font_family = JetBrainsMono Nerd Font SemiBold
    position = -50, -39
    halign = right
    valign = top
    shadow_passes = 1
    shadow_size = 2
}

# ── CENTER HERO: CLOCK & DATE ─────────────────────────────────────────────────

# Clock Glass Card
shape {
    monitor =
    size = 460, 215
    color = rgba(11, 16, 26, 0.72)
    rounding = 24
    border_size = 1
    border_color = rgba(255, 215, 0, 0.38)
    position = 0, 185
    halign = center
    valign = center
}

# Giant Time (Asgard Gold + Electric Aura)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(255, 215, 0) # Asgard Gold
    font_size = 86
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 212
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 240, 255, 0.4)
}

# Date & Norse Runes (Electric Cyan)
label {
    monitor =
    text = cmd[update:1000] echo "⚡ $(date +"%A, %d %B")  ᚦ ᛋ"
    color = rgb(0, 240, 255) # Electric Cyan
    font_size = 15
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 122
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# ── NOW PLAYING / MEDIA CARD ──────────────────────────────────────────────────

# Media Glass Pill
shape {
    monitor =
    size = 460, 44
    color = rgba(15, 22, 34, 0.78)
    rounding = 22
    border_size = 1
    border_color = rgba(0, 240, 255, 0.35)
    position = 0, 45
    halign = center
    valign = center
}

# Media Info Label
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/player_lock.sh
    color = rgb(226, 232, 240)
    font_size = 11
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 45
    halign = center
    valign = center
}

# ── USER IDENTITY ─────────────────────────────────────────────────────────────

# User Badge with Mjölnir Runes
label {
    monitor =
    text = ᚦ  $USER  ᛋ
    color = rgb(255, 215, 0) # Asgard Gold
    font_size = 18
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -25
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Realm Subtitle
label {
    monitor =
    text = Sovereign of the Nine Realms
    color = rgba(162, 178, 200, 0.8)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, -48
    halign = center
    valign = center
}

# ── PASSWORD INPUT FIELD ──────────────────────────────────────────────────────
input-field {
    monitor =
    size = 340, 52
    outline_thickness = 2
    dots_size = 0.25 # Scale of dots
    dots_spacing = 0.28 # Spacing between dots
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 215, 0, 0.9) rgba(0, 240, 255, 0.9) 45deg
    inner_color = rgba(15, 22, 34, 0.88)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##00F0FF">ᛋ Speak, Worthy One...</span>
    hide_input = false
    rounding = 16
    check_color = rgb(0, 240, 255)
    fail_color = rgb(255, 85, 85)
    fail_text = <i><span foreground="##FF5555">⚡ Not Worthy to Wield Mjölnir ($ATTEMPTS)</span></i>
    fail_transition = 300
    capslock_color = rgb(255, 215, 0)
    position = 0, -105
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ── QUICK POWER ACTIONS (BOTTOM) ──────────────────────────────────────────────

# Power Buttons Backdrop Pill
shape {
    monitor =
    size = 230, 48
    color = rgba(15, 22, 34, 0.78)
    rounding = 24
    border_size = 1
    border_color = rgba(255, 215, 0, 0.35)
    position = 0, 68
    halign = center
    valign = bottom
}

# Suspend Button
label {
    monitor =
    text = 󰤄
    color = rgb(0, 240, 255) # Electric Cyan
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    onclick = systemctl suspend
    position = -60, 77
    halign = center
    valign = bottom
}

# Reboot Button
label {
    monitor =
    text = 󰜉
    color = rgb(255, 215, 0) # Asgard Gold
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    onclick = systemctl reboot
    position = 0, 77
    halign = center
    valign = bottom
}

# Poweroff Button
label {
    monitor =
    text = 󰐥
    color = rgb(255, 85, 85) # Ragnarok Red
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    onclick = systemctl poweroff
    position = 60, 77
    halign = center
    valign = bottom
}

# ── FOOTER MOTTO ──────────────────────────────────────────────────────────────
label {
    monitor =
    text = ᚦ Whosoever holds this hammer, if he be worthy, shall possess the power of Thor ᛋ
    color = rgba(162, 178, 200, 0.65)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, 22
    halign = center
    valign = bottom
}
